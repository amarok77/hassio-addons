name: Dozzle Agent
version: 0.0.1
slug: dozzle-agent
description: Dozzle Agent
url: https://github.com/amir20/dozzle
image: amir20/dozzle:latest
arch:
  - armv7
  - aarch64
  - amd64
startup: service
boot: auto
init: false
command: agent
volumes:
  - /var/run/docker.sock:/var/run/docker.sock:ro
ports:
  - 7007:7007
